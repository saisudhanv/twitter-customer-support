[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hiver-support-agent"
version = "0.1.0"
description = "Production-quality AI customer support agent with rigorous evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Hiver Developer", email = "dev@hiver.local"}
]

dependencies = [
    "pandas>=3.0.0",
    "numpy>=2.5.0",
    "scikit-learn>=1.9.0",
    "kagglehub>=1.0.0",
    "openai>=1.30.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=24.1.0",
    "flake8>=7.0.0",
    "mypy>=1.7.0",
    "isort>=5.13.0",
]

notebook = [
    "jupyter>=1.0.0",
    "ipython>=8.18.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312', 'py314']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
